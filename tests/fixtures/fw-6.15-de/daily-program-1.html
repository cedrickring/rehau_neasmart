<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REHAU Nea Smart Installation</title></head><style>input,textarea,select,button{font-family:Arial;}input[type=number]{text-align:right}input[type=submit],input[type=button],input[type=checkbox],input[type=date],select{-webkit-appearance:none;border-radius:0}.pinkR{color:#DD0060}.textCenter{text-align:center}body{width:60%;margin:auto;font-family:Arial;display:block}header{display:inline-block;font-size:2em;width:100%;margin-top:2%}.inputsubmit{display:inline-block;width:50%;color:white;background:#7F7F7F;border:none;padding:1%;margin:1%;text-align:center}.svg-icon{width:4%}td,th{border:1px solid black}.half{width:50%}.full{width:100%}table{width:100%;border-collapse:collapse}td{text-align:center;vertical-align:middle;align:center;padding-top:10%;padding-bottom:10%}.presence{background:#DD0060}.absence{background:#F2F2F2}.tableTimeLine{display:block;width:48%;height:30%;float:right}.tableTimeGrad td {background:white;padding-top:1%;padding-bottom:1%;border-color:white;} .lineHeure td{border-color:white;padding:0%;text-align:left}input{text-align:center;padding-bottom:1%;padding-top:1%;border:solid 1px black}@media only screen and (max-width:425px){.svg-icon{width:10%}body{width:100%}header label{font-size:.7em}.header{margin-left:-10%}}@media only screen and (min-width:425px){.svg-icon{width:8%}body{width:90%}.header{margin-left:-8%}}@media only screen and (min-width:768px){.svg-icon{width:8%}body{width:80%}.header{margin-left:-8%}}@media only screen and (min-width:1024px){.svg-icon{width:4%}body{width:60%}.header{margin-left:-4%}}@media only screen and (min-width:1440px){.svg-icon{width:4%}body{width:60%}.header{margin-left:-4%}}</style><header><div class="textCenter"><a href="user-daily-program.html"><svg class="svg-icon" style="float: left" viewBox="0 0 1024 1024"><path d="m298.7 512l341.3-213.3v426.7z"/></svg></a><label class="header">Tagesprogramm Nr. 1</label></div></header><body onload="start()"><div class=""><table class="table_time" id="table"><tr  id="tr-one"><table class="tableTimeGrad""><tr  id="tr-two"></tr></table><table class="lineHeure"><tr class=""><td style="width: 25%">0h</td><td style="width: 25%">6h</td><td>12h</td><td>18h</td></tr></table></div><br><input class="inputsubmit full" type="submit" value="Alles löschen" onclick="deleteTiming()" ><span class="blockTime textCenter"><form onsubmit="return false" class="timePeriod"><h2 class="">Zeitbereich hinzufügen</h2><label for="start">Startzeit:</label> <input id="start" type="time" name="start" step="900" ><br><br><label for="end">Endezeit:</label> <input id="end" type="time" name="end" step="900" ><br><br><input class="inputsubmit half" type="submit" value="Zeitbereich hinzufügen" onclick="change()" ></form></span><form action="user-daily-program.html" method="post" id="form"><input name="pDaily" type="hidden"><input name="idProgDay" type="hidden" value="0" id="hidden"><input id="prog" name="prog" type="hidden" value="000000000000000000000000111111110000000000000000000000000000000011111111111111111111111100000000"><input class="inputsubmit full" type="submit" value="Bestätigen" onclick="" ></form></body><script>function start(){var trOne=document.getElementById("tr-one");for(var i=0;i<96;i+=4){var x=document.createElement("td");x.setAttribute("type","number");x.setAttribute("id",i/4);x.setAttribute("name",i*900);if(document.getElementById("prog").value.substring(i,i+4).includes("1")){x.setAttribute("class","presence")}else{x.setAttribute("class","absence")}x.style.color="white";trOne.appendChild(x)}var trTwo=document.getElementById("tr-two");for(var i=0;i<24;i+=1){var x=document.createElement("td");x.style.color="white";if((i%6)==0)x.style.borderLeftColor="black";if(((i+1)%6)==0)x.style.borderRightColor="black";trTwo.appendChild(x)}}function change(){if((document.getElementById("start").value)&&(document.getElementById("end").value)){var start=hmsToSecondsOnly(document.getElementById("start").value);var end=hmsToSecondsOnly(document.getElementById("end").value);changeTDMode(start,end,"presence");updateProg(start,end,"presence");var trOne=document.getElementById("tr-timeLine")}}function deleteTiming(){updateProg(0,86400,"absence");for(var i=0;i<96;i+=4){if(document.getElementById("prog").value.substring(i,i+4).includes("1")){document.getElementById(i/4).setAttribute("class","presence")}else{document.getElementById(i/4).setAttribute("class","absence")}}}function updateProg(start,end,mode){var startProg=start/900;var endProg=end/900;if(endProg==0){endProg=96}for(var h=startProg;h<endProg;h++){if(mode=="presence"){document.getElementById("prog").value=document.getElementById("prog").value.replaceAt(h,"1")}else{document.getElementById("prog").value=document.getElementById("prog").value.replaceAt(h,"0")}}}String.prototype.replaceAt=function(index,replacement){return this.substr(0,index)+replacement+this.substr(index+replacement.length)};function changeTDMode(start,end,mode){var startIndex,endIndex;var array=document.getElementById("table").getElementsByTagName("td");for(var i=0;i<array.length;i++){var status=array[i].getAttribute("name");if(status==start){startIndex=i}if(status==end){if(end==0){endIndex=24}else{endIndex=i}}}if(!startIndex){var startIndex=parseInt(start/3600)}if(!endIndex){var endIndex=parseInt(end/3600)}for(var j=startIndex;j<endIndex;j++){array[j].removeAttribute("class");array[j].setAttribute("class",mode)}if(startIndex==endIndex){array[startIndex].removeAttribute("class");array[endIndex].setAttribute("class",mode)}}function hmsToSecondsOnly(str){var a=str.split(':');var s=((+a[0])*60*60)+((+a[1])*60);return s}function sendProgram(){var input=document.getElementById("prog");for(var i=0;i<96;i++){if(document.getElementById(i+"").classList.contains("absence")){input.value+="0"}else{input.value+="1"}}return!1}</script></html>
