[project]
name = "rehau-neasmart"
version = "1.0.0"
description = "Home Assistant integration for the REHAU Nea Smart 2.0 base station over its local web UI"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
    "beautifulsoup4==4.15.0",
    "pytest-cov==7.0.0",
    "pytest-homeassistant==2026.11.1",
    "ruff==0.14.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.rehau_neasmart"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D", "DTZ"]
ignore = [
    "D203",
    "D213",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
